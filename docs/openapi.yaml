openapi: 3.0.3
info:
  title: NAS API
  description: Network Attached Storage API with file management, user management, WebDAV, and mDNS
  version: 2.0.0

servers:
  - url: http://localhost:8088
    description: Local development server

paths:
  # ========== Auth ==========
  /api/users/login:
    post:
      summary: Login
      operationId: login
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [Username, Password]
              properties:
                Username: { type: string }
                Password: { type: string }
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserInfoResponse'

  /api/users/logout:
    post:
      summary: Logout
      operationId: logout
      tags: [Auth]
      responses:
        '200':
          $ref: '#/components/responses/Success'

  /api/users/me:
    get:
      summary: Get current user
      operationId: getCurrentUser
      tags: [Auth]
      responses:
        '200':
          description: Current user info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserInfoResponse'

  # ========== User Management (admin) ==========
  /api/users:
    get:
      summary: List users
      operationId: listUsers
      tags: [Users]
      security: [{ sessionAuth: [] }]
      responses:
        '200':
          description: User list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListResponse'
    post:
      summary: Create user
      operationId: createUser
      tags: [Users]
      security: [{ sessionAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [Username, Password]
              properties:
                Username: { type: string }
                Password: { type: string }
                CanRead: { type: boolean }
                CanWrite: { type: boolean }
      responses:
        '200':
          $ref: '#/components/responses/Success'

  /api/users/{username}:
    put:
      summary: Update user permissions
      operationId: updateUser
      tags: [Users]
      security: [{ sessionAuth: [] }]
      parameters:
        - name: username
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                CanRead: { type: boolean }
                CanWrite: { type: boolean }
      responses:
        '200':
          $ref: '#/components/responses/Success'
    delete:
      summary: Delete user
      operationId: deleteUser
      tags: [Users]
      security: [{ sessionAuth: [] }]
      parameters:
        - name: username
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          $ref: '#/components/responses/Success'

  /api/users/{username}/password:
    put:
      summary: Change password
      operationId: changePassword
      tags: [Users]
      parameters:
        - name: username
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [CurrentPassword, NewPassword]
              properties:
                CurrentPassword: { type: string }
                NewPassword: { type: string }
      responses:
        '200':
          $ref: '#/components/responses/Success'

  /api/scanfs:
    post:
      summary: Scan filesystem and sync DB
      operationId: scanFiles
      tags: [Admin]
      security: [{ sessionAuth: [] }]
      responses:
        '200':
          description: Scan result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanResultResponse'

  # ========== File Operations ==========
  /simple_upload/object/{filename}:
    head:
      summary: Get file metadata
      operationId: getFileMetadata
      tags: [Files]
      parameters:
        - name: filename
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: File metadata in headers
          headers:
            Content-Length:
              schema: { type: integer }
            Content-Disposition:
              schema: { type: string }
            Content-Type:
              schema: { type: string }

    get:
      summary: Download file
      operationId: downloadFile
      tags: [Files]
      parameters:
        - name: filename
          in: path
          required: true
          schema: { type: string }
        - name: Download
          in: query
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: File content
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary

    post:
      summary: Upload file
      operationId: uploadFile
      tags: [Files]
      parameters:
        - name: filename
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                File:
                  type: string
                  format: binary
                Overwrite:
                  type: boolean
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'

    delete:
      summary: Delete file or directory
      operationId: deleteFile
      tags: [Files]
      parameters:
        - name: filename
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '404':
          $ref: '#/components/responses/Error'

    patch:
      summary: Update file tags
      operationId: updateFileTags
      tags: [Files]
      parameters:
        - name: filename
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [Tags]
              properties:
                Tags:
                  type: array
                  items: { type: string }
      responses:
        '200':
          $ref: '#/components/responses/Success'

  /simple_upload/objects:
    get:
      summary: List root directory
      operationId: listRootDirectory
      tags: [Files]
      responses:
        '200':
          description: Root directory listing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DirectoryResponse'

  /simple_upload/objects/{path}:
    get:
      summary: List directory contents
      operationId: listDirectory
      tags: [Files]
      parameters:
        - name: path
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Directory listing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DirectoryResponse'

  /simple_upload/objects/:
    post:
      summary: Multi-file upload
      operationId: multiUpload
      tags: [Files]
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                Dir:
                  type: string
                Overwrite:
                  type: string
                File:
                  type: array
                  items:
                    type: string
                    format: binary
      responses:
        '200':
          $ref: '#/components/responses/Success'

  /simple_upload/mkdir/{path}:
    post:
      summary: Create directory
      operationId: mkdir
      tags: [Files]
      parameters:
        - name: path
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          $ref: '#/components/responses/Success'

  /simple_upload/search:
    get:
      summary: Search files
      operationId: searchFiles
      tags: [Files]
      parameters:
        - name: Keyword
          in: query
          schema: { type: string }
        - name: Tag
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DirectoryResponse'

  /simple_upload/preview/{path}:
    get:
      summary: Preview document
      description: Convert Office/PDF to HTML preview (requires libreoffice)
      operationId: previewFile
      tags: [Files]
      parameters:
        - name: path
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: HTML preview content or converted PDF

components:
  responses:
    Success:
      description: Success
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SuccessResponse'
    Error:
      description: Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    SuccessResponse:
      type: object
      properties:
        TraceID: { type: string }
        Code: { type: string, example: "success" }
        Message: { type: string }
        Data: { nullable: true }

    ErrorResponse:
      type: object
      properties:
        TraceID: { type: string }
        Code:
          type: string
          enum: [unknown, invalid_arguments, not_found, file_exists, "403"]
        Message: { type: string }
        Data: { nullable: true }

    UserInfo:
      type: object
      properties:
        Username: { type: string }
        CanRead: { type: boolean }
        CanWrite: { type: boolean }
        IsAdmin: { type: boolean }

    UserInfoResponse:
      type: object
      properties:
        TraceID: { type: string }
        Code: { type: string }
        Message: { type: string }
        Data:
          $ref: '#/components/schemas/UserInfo'

    UserListResponse:
      type: object
      properties:
        TraceID: { type: string }
        Code: { type: string }
        Message: { type: string }
        Data:
          type: array
          items:
            $ref: '#/components/schemas/UserInfo'

    ScanResultResponse:
      type: object
      properties:
        TraceID: { type: string }
        Code: { type: string }
        Message: { type: string }
        Data:
          type: object
          properties:
            Total: { type: integer }
            New: { type: integer }
            Skipped: { type: integer }

    FileInfo:
      type: object
      properties:
        Name: { type: string }
        Size: { type: integer, format: int64 }
        FileType:
          type: string
          enum: [file, dir]
        Tags:
          type: array
          items: { type: string }

    DirectoryResponse:
      type: object
      properties:
        TraceID: { type: string }
        Code: { type: string }
        Message: { type: string }
        Data:
          type: object
          properties:
            List:
              type: array
              items:
                $ref: '#/components/schemas/FileInfo'

  securitySchemes:
    sessionAuth:
      type: apiKey
      in: cookie
      name: nas_session
    basicAuth:
      type: http
      scheme: basic

security: []